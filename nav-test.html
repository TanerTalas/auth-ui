<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test</title>
    <link rel="stylesheet" href="./signin-test.css" />
    <script href="./lang.js"></script>
    <script href="./script.js"></script>
  </head>
  <body>
    <!-- nav - start -->
    <nav>
      <div class="nav-container">
        <div id="nav-logo">
          <img src="./images/icons/logo-icon.svg" alt="Taner Talas's logo" />
        </div>

        <ul class="navbar">
          <li id="portfolio-link" class="nav-link">
            <a href="https://tanertalas.github.io" data-i18n="nav.portfolio"
              >Portfolio</a
            >
          </li>
          <li class="nav-button">
            <button
              type="button"
              id="openSignIn"
              data-i18n="common.sign_in"
            >
              Sign In
            </button>
          </li>
          <li class="nav-button">
            <button
              type="button"
              id="openSignUp"
              data-i18n="common.sign_up"
            >
              Sign Up
            </button>
          </li>
        </ul>

        <button id="themeButton" aria-label="Toggle light / dark mode">
          <span class="themeIcon-wrapper">
            <img src="./images/sun.svg" alt="" class="themeIcon sun" />
            <img src="./images/moon.svg" alt="" class="themeIcon moon" />
          </span>
        </button>
      </div>
    </nav>

    <!-- nav - end -->


    <!-- language switcher -->
    <div class="lang-switcher">
      <button type="button" class="lang-btn">TR</button>
      <button type="button" class="lang-btn">EN</button>
    </div>

    <main>
      <!-- sign in - start -->
      <div class="wrapper">
        <section id="sign-in-container1" class="container">
          <div class="left" id="sign-in-left1">
            <h3 data-i18n="signin.left.h3">Welcome Back!</h3>
            <p data-i18n="signin.left.p">
              We’ve missed you. Let’s get you signed in.
            </p>
            <button class="sign-up-text" type="button">
              <span class="cta-prefix" data-i18n="signin.left.cta_prefix"
                >New here?</span
              >
              <span class="cta-action" data-i18n="signin.left.cta_action"
                >Create account</span
              >
            </button>
          </div>
          <div class="right" id="sign-in-right1">
            <h2 data-i18n="signin.right.h2">Sign In</h2>
            <form class="form sign-in-form1">
              <!-- Email input -->
              <div class="input-group">
                <input
                  type="email"
                  id="sign-in-email"
                  name="sign-in-email"
                  placeholder="you@example.com"
                  required
                  autocomplete="off"
                  data-i18n-placeholder="common.email.placeholder"
                />
                <label for="sign-in-email" data-i18n="common.email.label"
                  >Email</label
                >
                <img
                  src="./images/icons/email-icon.svg"
                  alt="Email field icon"
                  class="input-icon"
                />
              </div>
              <!-- Password input -->
              <div class="input-group">
                <input
                  type="password"
                  id="sign-in-password"
                  name="sign-in-password"
                  placeholder="••••••••"
                  required
                  autocomplete="off"
                  minlength="8"
                />
                <label for="sign-in-password" data-i18n="common.password"
                  >Password</label
                >
                <img
                  src="./images/icons/password-icon.svg"
                  alt="Password field icon"
                  class="input-icon"
                />
                <button
                  type="button"
                  class="show-pass"
                  aria-label="Show password"
                  tabindex="-1"
                >
                  <img
                    src="./images/icons/show-password-icon.svg"
                    alt="show password icon"
                  />
                </button>
              </div>
              <!-- Remember me -->
              <div class="remember-me">
                <input
                  type="checkbox"
                  id="sign-in-remember"
                  name="sign-in-remember"
                />
                <label for="sign-in-remember" data-i18n="signin.right.remember"
                  >Remember me for 30 days</label
                >
              </div>
              <!-- Forgot password -->
              <button
                type="button"
                class="forgot-pass-text"
                data-i18n="signin.right.forgot"
              >
                Forgot password?
              </button>
              <!-- Submit button -->
              <button
                type="submit"
                class="btn log-in-btn"
                data-i18n="common.log_in"
              >
                Log in
              </button>
            </form>
          </div>
        </section>
      </div>
      <!-- sign in - end -->
    </main>
  </body>
</html>
